{% with atual=request.resolver_match.url_name %}
<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/70 backdrop-blur dark:border-slate-800 dark:bg-slate-900/60">
  <div class="mx-auto flex w-full max-w-6xl items-center gap-6 px-4 py-3 sm:px-6">
    {% include "_logo.html" %}

    <div class="hidden md:block">{% include "_links_nav.html" %}</div>

    <div class="ml-auto flex items-center gap-2">
      <button type="button" onclick="alternarTema()" title="Alternar tema claro/escuro"
              class="grid h-9 w-9 place-items-center rounded-lg border border-slate-200 transition hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">
        <svg class="hidden h-5 w-5 text-amber-400 dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="h-5 w-5 text-slate-600 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      {% if user.is_authenticated %}{% include "_menu_usuario.html" %}{% endif %}
    </div>
  </div>
</header>
{% endwith %}
